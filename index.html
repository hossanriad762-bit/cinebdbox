<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07080d">
<title>Cinebdbox Admin</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080d;--card:#12141e;--line:rgba(255,255,255,.09);--txt:#eceef6;--mut:#9aa1b8;--pri:#ff2d55;--pri2:#ff7a45;--gold:#ffc857;--ok:#2ecc71;--grad:linear-gradient(135deg,#ff2d55,#ff7a45)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font:14.5px/1.6 'Poppins','Hind Siliguri',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 35% at 15% 10%,rgba(255,45,85,.15),transparent 60%),radial-gradient(35% 30% at 90% 20%,rgba(91,76,255,.13),transparent 60%)}
a{color:var(--gold);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font:inherit;outline:0;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(255,45,85,.15)}
select option{background:#12141e}
textarea{resize:vertical;min-height:84px}
input[type=checkbox]{width:auto;accent-color:var(--pri)}
label.f{display:block;margin:12px 0 4px;color:var(--mut);font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;border:0;font-weight:600;color:#fff;background:var(--grad);box-shadow:0 8px 22px rgba(255,45,85,.3);transition:.25s;font-size:14px}
.btn:hover{transform:translateY(-2px)}
.btn.gl{background:rgba(255,255,255,.09);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:6px 13px;font-size:12.5px;border-radius:9px}
.btn.red{background:rgba(255,45,85,.15);border:1px solid rgba(255,45,85,.4);box-shadow:none;color:#ff8a9c}
.btn.ok{background:rgba(46,204,113,.15);border:1px solid rgba(46,204,113,.4);box-shadow:none;color:#7ee2a8}
.btn[disabled]{opacity:.5;pointer-events:none}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:410px;padding:28px;border-radius:24px;background:rgba(18,20,30,.88);border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.6)}
.logo{font-weight:800;font-size:22px;margin-bottom:4px}.logo em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.err{color:#ff8a9c;font-size:13px;min-height:20px;margin-top:10px}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:rgba(10,11,18,.9);display:flex;flex-direction:column}
.side .logo{padding:0 10px 18px}
.side a{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:12px;color:#cfd3e4;margin-bottom:4px;cursor:pointer;transition:.2s}
.side a:hover{background:rgba(255,255,255,.06)}
.side a.on{background:var(--grad);color:#fff}
.side .grow{flex:1}
.main{padding:26px;min-width:0;max-width:1100px;width:100%}
h2.t{font-size:22px;font-weight:700;margin-bottom:16px}
h3.s{font-size:16px;margin:0 0 12px}
.panel{padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:16px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font-size:26px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.stat span{color:var(--mut);font-size:12.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bars .it{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 54px;gap:10px;align-items:center;padding:7px 0;font-size:13px}
.bars .it span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:9px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad)}
.bars .it b{text-align:right;font-weight:600}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:7px 16px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;font-size:13px}
.tabs button.on{background:var(--grad);border-color:transparent}
.item{padding:14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:10px}
.item .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.item b{font-size:15px}
.item small{color:var(--mut)}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:700;background:rgba(255,200,87,.15);color:var(--gold)}
.pill.ok{background:rgba(46,204,113,.15);color:#7ee2a8}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:12px}
.res .r{cursor:pointer;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid var(--line);transition:.2s}
.res .r:hover{border-color:var(--pri);transform:translateY(-3px)}
.res img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#1a1d2b}
.res .r div{padding:6px 8px;font-size:12px;line-height:1.3}
.dl{display:grid;grid-template-columns:90px 90px 80px 1fr 36px;gap:8px;margin-bottom:8px}
.ssb{padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);margin-bottom:10px}
.chk{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px}
.chk label{display:flex;align-items:center;gap:6px;font-size:13px;color:#dfe2f0}
.out textarea{min-height:200px;font:12.5px/1.5 ui-monospace,Menlo,monospace}
.hint{color:var(--mut);font-size:12.5px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);padding:11px 20px;border-radius:12px;background:#1b1e2e;border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.6);z-index:99;font-size:13.5px}
.toast.bad{border-color:var(--pri);color:#ff8a9c}
.skl{height:90px;border-radius:16px;background:linear-gradient(90deg,#141623 25%,#1e2135 37%,#141623 63%);background-size:400% 100%;animation:skl 1.4s infinite;margin-bottom:12px}
@keyframes skl{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media(max-width:800px){
 .shell{grid-template-columns:1fr}
 .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px;z-index:50;border-right:0;border-top:1px solid var(--line);background:rgba(10,11,18,.96)}
 .side .logo,.side .grow,.side .so{display:none}
 .side a{flex:1;flex-direction:column;gap:2px;font-size:10.5px;padding:7px 2px;margin:0;text-align:center}
 .main{padding:16px 14px 100px}
 .row2,.row3{grid-template-columns:1fr}
 .dl{grid-template-columns:1fr 1fr}
 .lk{grid-template-columns:1fr 1fr}.lk small,.lk input:nth-child(4){grid-column:1/-1}
 .side a{min-width:0;font-size:9.5px!important;overflow:hidden;white-space:nowrap}
 .dl input:nth-child(4){grid-column:1/-1}
 .bars .it{grid-template-columns:minmax(0,1fr) 50px}.bars .it .bar{display:none}
}
.pill.dr{background:rgba(255,255,255,.1);color:#cfd3e4}
.pi .pr{display:flex;gap:10px;align-items:flex-start}
.pi .pr img,.pi .pr .ph{flex:0 0 auto;width:46px;height:69px;border-radius:8px;object-fit:cover;background:#1a1d2b}
.pi .sk{margin-top:4px;width:18px;height:18px}
.pi b{word-break:break-word}
.bulk{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;margin-bottom:12px;border-radius:14px;background:#1b1e2e;border:1px solid var(--pri);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.lk{display:grid;grid-template-columns:minmax(0,1fr) 90px 80px minmax(0,2fr);gap:8px;align-items:center;margin-bottom:8px}
.lk small{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed textarea{min-height:360px;font:12.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre;overflow:auto}
summary{outline:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="tst"></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getDatabase,ref,get,set,update,remove,query,orderByChild,limitToLast} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const FBC={apiKey:"AIzaSyCkDu3KVnyyLJBTm9R20lZ1NLj7RLsvJFk",authDomain:"cinebdbox.firebaseapp.com",databaseURL:"https://cinebdbox-default-rtdb.firebaseio.com",projectId:"cinebdbox",storageBucket:"cinebdbox.firebasestorage.app",messagingSenderId:"718742810995",appId:"1:718742810995:web:1c35947b79572d048ad506"};
const app=initializeApp(FBC),auth=getAuth(app),db=getDatabase(app);

/* ---------------- helpers ---------------- */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d=''){try{return localStorage.getItem(k)??d}catch{return d}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const nf=n=>{n=+n||0;return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n)};
const goodUrl=u=>/^https?:\/\/[^\s"'<>]+$/i.test((u||'').trim())?u.trim():'';
const pk=u=>String(u||'').replace(/\.html.*$/,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,120)||'home';
const dlFile=(n,t)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};
const when=t=>t?new Date(t).toLocaleString('bn-BD',{dateStyle:'medium',timeStyle:'short'}):'';
const siteUrl=()=>(LS.get('site','https://cinebdbox.blogspot.com')).replace(/\/+$/,'');
let tt;function toast(m,bad){clearTimeout(tt);$('#tst').innerHTML=`<div class="toast${bad?' bad':''}">${esc(m)}</div>`;tt=setTimeout(()=>$('#tst').innerHTML='',2800)}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}toast('কপি হয়েছে')}
const app$=()=>$('#app');

/* ---------------- auth screens ---------------- */
function showLogin(msg=''){
  app$().innerHTML=`<div class="center"><form class="box" id="lf"><div class="logo">Cine<em>bdbox</em> Admin</div><p style="color:var(--mut);margin-bottom:12px">অ্যাডমিন লগইন</p>
  <label class="f">ইমেইল</label><input type="email" id="em" autocomplete="username" required>
  <label class="f">পাসওয়ার্ড</label><input type="password" id="pw" autocomplete="current-password" required>
  <button class="btn" style="width:100%;margin-top:16px" id="lb">লগইন</button><div class="err" id="le">${esc(msg)}</div></form></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();$('#lb').disabled=true;$('#le').textContent='';
    try{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}
    catch(x){$('#le').textContent='লগইন হয়নি: ইমেইল বা পাসওয়ার্ড ভুল।';$('#lb').disabled=false}};
}
function showDenied(u){
  app$().innerHTML=`<div class="center"><div class="box"><div class="logo">Cine<em>bdbox</em> Admin</div>
  <p style="margin:12px 0">আপনি লগইন করেছেন, কিন্তু এই অ্যাকাউন্ট এখনো অ্যাডমিন হিসেবে যুক্ত নয়।</p>
  <p class="hint">Firebase Console → Realtime Database → Data → নতুন নোড বানান:</p>
  <div class="item" style="word-break:break-all"><small>admins / ${esc(u.uid)}</small><br><b>true</b> (boolean)</div>
  <p class="hint">তারপর পেজ রিফ্রেশ করুন।</p>
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn gl" id="cu">UID কপি</button><button class="btn gl" id="so">লগআউট</button></div></div></div>`;
  $('#cu').onclick=()=>copy(u.uid);$('#so').onclick=()=>signOut(auth);
}

/* ---------------- shell ---------------- */
const TABS=[['dash','▦','ড্যাশবোর্ড'],['posts','☰','পোস্ট'],['gen','✎','নতুন পোস্ট'],['pages','❏','পেজ'],['req','✉','রিকোয়েস্ট'],['rep','⚑','রিপোর্ট'],['hub','☁','ডাউনলোড হাব'],['soon','⏳','আসছে'],['short','🔗','শর্টনার'],['cmt','💬','কমেন্ট'],['tools','🧰','টুলস'],['set','⚙','সেটিংস']];
let cur='dash';
function showApp(u){
  app$().innerHTML=`<div class="shell"><nav class="side"><div class="logo">Cine<em>bdbox</em></div>
  ${TABS.map(t=>`<a data-t="${t[0]}"><span>${t[1]}</span>${t[2]}</a>`).join('')}<div class="grow"></div>
  <a class="so" id="so"><span>⏻</span>লগআউট</a></nav><main class="main" id="main"></main></div>`;
  $$('.side a[data-t]').forEach(a=>a.onclick=()=>go(a.dataset.t));
  if(LS.get('cid'))loadGIS().catch(()=>{});
  $('#so').onclick=()=>signOut(auth);
  go(location.hash.slice(1)||'dash');
}
function go(t){
  if(!TABS.some(x=>x[0]===t))t='dash';
  cur=t;location.hash=t;
  $$('.side a[data-t]').forEach(a=>a.classList.toggle('on',a.dataset.t===t));
  $('#main').innerHTML='<div class="skl"></div><div class="skl"></div>';
  ({dash:vDash,posts:vPosts,gen:vGen,pages:vPages,req:vReq,rep:vRep,hub:vHub,cmt:vCmt,tools:vTools,short:vShort,soon:vSoon,set:vSet}[t])().catch(e=>{$('#main').innerHTML=`<div class="panel"><b>সমস্যা হয়েছে</b><p class="hint">${esc(e.message||e)}</p><p class="hint">Firebase Rules (firebase-rules.json) Publish করা আছে কিনা দেখুন।</p></div>`});
}

/* ---------------- dashboard ---------------- */
async function vDash(){
  const [v,l,rq,rp]=await Promise.all(['views','likes','requests','reports'].map(p=>get(ref(db,p))));
  const views=[];v.forEach(c=>{const x=c.val()||{};views.push({k:c.key,c:+x.c||0,t:x.t||c.key,u:x.u||''})});
  const likes=[];l.forEach(c=>{likes.push({k:c.key,c:+c.val()||0})});
  const tmap={};views.forEach(x=>tmap[x.k]=x);
  let pend=0,reqN=0,repN=0;
  rq.forEach(c=>{reqN++;if((c.val()||{}).s!=='done')pend++});rp.forEach(c=>{repN++});
  const totalV=views.reduce((a,b)=>a+b.c,0),totalL=likes.reduce((a,b)=>a+b.c,0);
  const topV=views.sort((a,b)=>b.c-a.c).slice(0,10),topL=likes.sort((a,b)=>b.c-a.c).slice(0,8);
  const maxV=topV[0]?.c||1,maxL=topL[0]?.c||1;
  $('#main').innerHTML=`<h2 class="t">ড্যাশবোর্ড</h2>
  <div class="grid4"><div class="stat"><b>${nf(totalV)}</b><span>মোট ভিউ</span></div><div class="stat"><b>${views.length}</b><span>ভিউ পাওয়া পোস্ট</span></div><div class="stat"><b>${nf(totalL)}</b><span>মোট লাইক</span></div><div class="stat"><b>${pend}</b><span>পেন্ডিং রিকোয়েস্ট (মোট ${reqN})</span></div><div class="stat"><b>${repN}</b><span>ব্রোকেন লিংক রিপোর্ট</span></div></div>
  <div class="panel bars"><h3 class="s">সবচেয়ে বেশি দেখা (Top 10)</h3>${topV.map(x=>`<div class="it"><span title="${esc(x.t)}">${x.u?`<a href="${esc(siteUrl()+x.u)}" target="_blank" rel="noopener">${esc(x.t)}</a>`:esc(x.t)}</span><div class="bar"><i style="width:${Math.max(3,x.c/maxV*100)}%"></i></div><b>${nf(x.c)}</b></div>`).join('')||'<p class="hint">এখনো কোনো ভিউ নেই।</p>'}</div>
  <div class="panel bars"><h3 class="s">সবচেয়ে বেশি লাইক</h3>${topL.map(x=>`<div class="it"><span>${esc(tmap[x.k]?.t||x.k)}</span><div class="bar"><i style="width:${Math.max(3,x.c/maxL*100)}%"></i></div><b>${nf(x.c)}</b></div>`).join('')||'<p class="hint">এখনো কোনো লাইক নেই।</p>'}</div>
  <div class="panel"><h3 class="s">ব্লগের ঠিকানা</h3><p class="hint">ড্যাশবোর্ডের লিংকগুলো এই ঠিকানা দিয়ে খুলবে।</p><div style="display:flex;gap:8px;margin-top:8px"><input id="site" value="${esc(siteUrl())}"><button class="btn gl" id="ss">সেভ</button></div></div>`;
  $('#ss').onclick=()=>{LS.set('site',$('#site').value.trim());toast('সেভ হয়েছে')};
  Promise.all([get(query(ref(db,'stats'),limitToLast(14))),get(ref(db,'dlc'))]).then(([st,dc])=>{
    const days=[];st.forEach(c=>{const x=c.val()||{};days.push({d:c.key.slice(5),v:+x.v||0,l:+x.d||0})});
    const D=[];dc.forEach(c=>{const x=c.val()||{};D.push({t:x.t||c.key,c:+x.c||0})});D.sort((a,b)=>b.c-a.c);const top=D.slice(0,8),mx=top[0]?.c||1;
    const g=$('.grid4');if(!g)return;
    g.insertAdjacentHTML('afterend',`<div class="panel"><h3 class="s">গত ১৪ দিনের ভিজিট ও ডাউনলোড</h3>${days.length?chart(days):'<p class="hint">ডেটা জমছে। থিম v14 চালু হওয়ার পর থেকে প্রতিদিনের হিসাব এখানে আসবে।</p>'}</div>
    <div class="panel bars"><h3 class="s">সবচেয়ে বেশি ডাউনলোড ক্লিক</h3>${top.map(x=>`<div class="it"><span>${esc(x.t)}</span><div class="bar"><i style="width:${Math.max(3,x.c/mx*100)}%"></i></div><b>${nf(x.c)}</b></div>`).join('')||'<p class="hint">এখনো ডেটা নেই।</p>'}</div>`);
  }).catch(()=>{});
  get(ref(db,'links')).then(sn=>{const L=[];sn.forEach(c=>{const x=c.val()||{};L.push({k:c.key,t:x.t||c.key,c:+x.c||0})});if(!L.length)return;const tot=L.reduce((a,b)=>a+b.c,0),top=L.sort((a,b)=>b.c-a.c).slice(0,6),mx=top[0].c||1;

function chart(a){
  const W=320,H=110,n=a.length,mx=Math.max(1,...a.map(x=>Math.max(x.v,x.l))),bw=W/n;
  const bars=a.map((x,i)=>{const h=x.v/mx*H,h2=x.l/mx*H,X=i*bw;return `<rect x="${X+bw*.12}" y="${H-h}" width="${bw*.76}" height="${h}" rx="3" fill="url(#cg)"><title>${x.d}: ${x.v} ভিজিট</title></rect><rect x="${X+bw*.3}" y="${H-h2}" width="${bw*.4}" height="${h2}" rx="2" fill="#ffc857"><title>${x.d}: ${x.l} ডাউনলোড</title></rect><text x="${X+bw/2}" y="${H+13}" text-anchor="middle" font-size="7.5" fill="#9aa1b8">${esc(x.d.slice(3))}</text>`}).join('');
  const tv=a.reduce((p,x)=>p+x.v,0),tl=a.reduce((p,x)=>p+x.l,0);
  return `<svg viewBox="0 0 ${W} ${H+18}" style="width:100%;height:auto"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff2d55"/><stop offset="1" stop-color="#ff7a45"/></linearGradient></defs>${bars}</svg><p class="hint"><span style="color:#ff5c6e">■</span> ভিজিট (${nf(tv)}) &nbsp; <span style="color:#ffc857">■</span> ডাউনলোড ক্লিক (${nf(tl)})</p>`;
}

async function tgSend(p){
  const tok=LS.get('tgtok'),chat=LS.get('tgchat');
  if(!tok||!chat)throw new Error('আগে "টুলস" ট্যাবে Telegram বট টোকেন ও চ্যাট আইডি দিন');
  const c=p.content||'',po=(c.match(/\[\[P:(\S+?)\]\]/)||[])[1]||(c.match(/<img[^>]+src=["']([^"']+)/i)||[])[1]||'';
  const tags=(p.labels||[]).filter(x=>/^[A-Za-z0-9 &-]+$/.test(x)&&!/^imdb|^\d{4}$/i.test(x)).slice(0,5).map(x=>'#'+x.replace(/[^A-Za-z0-9]+/g,'_')).join(' ');
  const cap=('🎬 '+(p.title||'')+(tags?'\n\n'+tags:'')+'\n\n📥 ডাউনলোড লিংক:\n'+(p.url||'')).slice(0,1000);
  const send=async(m,b)=>{const r=await fetch('https://api.telegram.org/bot'+tok+'/'+m,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:chat,...b})});const j=await r.json().catch(()=>({}));if(!j.ok)throw new Error(j.description||('Telegram ত্রুটি '+r.status));return j};
  if(po){try{return await send('sendPhoto',{photo:po.replace(/^http:/,'https:'),caption:cap})}catch(e){}}
  return send('sendMessage',{text:cap});
}

const CAST_RE=/<!--cast-->[\s\S]*?<!--\/cast-->\s*/;
function castBlock(c){return `<!--cast-->\n<h3>কাস্ট</h3>\n<div class="casts">\n`+c.map(x=>`  <div class="cs"><img src="${esc(x.p)}" alt="${esc(x.n)}" loading="lazy" /><b>${esc(x.n)}</b><small>${esc(x.r)}</small></div>`).join('\n')+`\n</div>\n<!--/cast-->`}
function setCast(html,c){
  const blk=castBlock(c)+'\n\n';let h=html.replace(CAST_RE,'');
  const k=h.search(/<div class="dl-box"/);if(k>=0)return h.slice(0,k)+blk+h.slice(k);
  const k2=h.search(/<h3>স্ক্রিনশট/);if(k2>=0)return h.slice(0,k2)+blk+h.slice(k2);
  return h.replace(/\s+$/,'')+'\n\n'+blk;
}
function ytId(v){v=(v||'').trim();if(!v)return '';const m=v.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{6,15})/);return m?m[1]:(/^[\w-]{6,15}$/.test(v)?v:'')}

  const shots=['f_s1','f_s2','f_s3'].map(i=>goodUrl(val(i))).filter(Boolean);
  const cats=$$('#cats input:checked').map(i=>i.value);
  const sn=mode==='tv'?(G.ss[0]?String(G.ss[0].n||1).padStart(2,'0'):'01'):'';
  /* title + labels */
  if(!$('#lock').checked){
    $('#o_title').value=[name,year?`(${year})`:'',mode==='tv'?`S${sn}`:'',lang,qtag].filter(Boolean).join(' ');
    const L=[mode==='tv'?'Web Series':'Movies',...cats,...genres,year,CMAP[country]||country,lang,plat,rating?'IMDb-'+rating:'',$('#t_trending').checked?'Trending':'',$('#t_featured').checked?'Featured':'',$('#t_newep').checked?'New Episode':'',$('#t_adult').checked?'18+':''];

function autoCats(d){

async function tmdb(path,params={}){
  const key=val('tk')||LS.get('tmdb');if(!key)throw new Error('TMDB API key দিন');LS.set('tmdb',key);
  const r=await fetch('https://api.themoviedb.org/3'+path+'?'+new URLSearchParams({api_key:key,language:'en-US',...params}));
  if(!r.ok)throw new Error('TMDB ত্রুটি '+r.status+' (কী ঠিক আছে?)');return r.json();

async function bulkCreate(){
  const lines=$('#bk_l').value.split('\n').map(x=>x.trim()).filter(Boolean),log=$('#bk_log'),pub=false;
  if(!lines.length)return toast('নাম লিখুন',1);
  try{if(!bOn())await bConnect()}catch(e){return toast('Blogger সংযোগ হয়নি: '+(e.message||e),1)}
  $('#bk_go').disabled=true;log.innerHTML='';let ok=0;
  for(const ln of lines){
    const [nm,opt]=ln.split('|').map(x=>x.trim()),tv=/^(tv|series)/i.test(opt||''),ym=nm.match(/\((\d{4})\)\s*$/),q=nm.replace(/\s*\(\d{4}\)\s*$/,'');
    log.insertAdjacentHTML('beforeend','<div>⏳ '+esc(ln)+'</div>');const row=log.lastElementChild;
    try{
      const type=tv?'tv':'movie';G.mode=type;$('#gm').value=type;
      G.dl=['480p','720p','1080p'].map(x=>({q:x,s:'',f:'MKV',l:'https://REPLACE.me/link'}));G.ss=[{n:1,zq:'720p',zs:'',zl:'',eps:'https://REPLACE.me/ep1'}];renderLists();
      const pr={query:q};if(ym)pr[tv?'first_air_date_year':'year']=ym[1];
      const it=((await tmdb('/search/'+type,pr)).results||[])[0];if(!it)throw new Error('TMDB-তে পাওয়া যায়নি');
      await pick(it.id,type);
      const body={kind:'blogger#post',title:val('o_title'),content:$('#o_html').value,labels:splitL($('#o_labels').value)};
      await bapi(bb('posts'),{method:'POST',q:{isDraft:!pub},body});
      row.textContent='✅ '+body.title;ok++;
    }catch(e){row.textContent='❌ '+ln+' — '+(e.message||e);if(e.need)break}

  LABELS=null;$('#bk_go').disabled=false;toast(ok+'টি পোস্ট তৈরি হয়েছে');
}
async function pick(id,type){

  setv('f_name',d.title||d.name);setv('f_year',((d.release_date||d.first_air_date)||'').slice(0,4));
  setv('f_rating',d.vote_average?d.vote_average.toFixed(1):'');setv('f_votes',d.vote_count?nf(d.vote_count):'');
  setv('f_runtime',tv?(d.number_of_episodes||''):(d.runtime||''));
  const c=(d.production_countries||[])[0]?.name||(d.origin_country||[])[0]||'';setv('f_country',CMAP[c]||c);
  const dirs=tv?(d.created_by||[]).map(x=>x.name):((d.credits?.crew||[]).filter(x=>x.job==='Director').map(x=>x.name));setv('f_dir',dirs.join(', '));

  setv('f_genres',mapG((d.genres||[]).map(g=>g.name)).join(', '));
  setv('f_story',d.overview||'');setv('f_status',tv?(d.status==='Ended'?'Completed':(d.status||'')):'');
  if(d.poster_path)setv('f_poster','https://image.tmdb.org/t/p/w780'+d.poster_path);
  const bd=(d.images?.backdrops||[]).slice(0,3);['f_s1','f_s2','f_s3'].forEach((id,i)=>setv(id,bd[i]?'https://image.tmdb.org/t/p/w1280'+bd[i].file_path:''));
  const tr=(d.videos?.results||[]).find(v=>v.site==='YouTube'&&v.type==='Trailer')||(d.videos?.results||[]).find(v=>v.site==='YouTube');setv('f_trailer',tr?tr.key:'');
  autoCats(d);

  build();toast('তথ্য বসানো হয়েছে, দেখে ঠিক করে নিন');
}

const BL={token:'',exp:0,bid:LS.get('bid')};
const BAPI='https://www.googleapis.com/blogger/v3/';
const bOn=()=>!!BL.token&&Date.now()<BL.exp-30000;
async function bConnect(){
  const cid=LS.get('cid');if(!cid)throw new Error('আগে OAuth Client ID সেভ করুন');
  await loadGIS();
  const r=await new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/blogger',
      callback:x=>x.error?rej(new Error(x.error_description||x.error)):res(x),
      error_callback:x=>rej(new Error(x.type==='popup_closed'?'Google উইন্ডো বন্ধ হয়েছে':(x.message||x.type||'Google ত্রুটি')))});
    tc.requestAccessToken();
  });
  BL.token=r.access_token;BL.exp=Date.now()+(+r.expires_in||3600)*1000;
  if(!BL.bid){const b=await bapi('blogs/byurl',{q:{url:siteUrl()+'/'}});BL.bid=b.id;LS.set('bid',b.id)}
  return true;
}
async function bapi(path,o={}){
  if(!bOn())throw Object.assign(new Error('Blogger-এ সংযুক্ত নন, আবার সংযুক্ত হন'),{need:1});
  const u=new URL(BAPI+path);
  Object.entries(o.q||{}).forEach(([k,v])=>(Array.isArray(v)?v:[v]).forEach(x=>{if(x!==''&&x!=null)u.searchParams.append(k,x)}));
  const r=await fetch(u,{method:o.method||'GET',headers:{Authorization:'Bearer '+BL.token,...(o.body?{'Content-Type':'application/json'}:{})},body:o.body?JSON.stringify(o.body):undefined});
  if(r.status===204)return {};
  const j=await r.json().catch(()=>({}));
  if(r.status===401){BL.token='';throw Object.assign(new Error('সেশন শেষ, আবার সংযুক্ত হন'),{need:1})}
  if(!r.ok)throw new Error(j.error?.message||('ত্রুটি '+r.status));
  return j;
}

const dec=s=>String(s).replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
const enc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
function getAttr(tag,n){const m=tag.match(new RegExp('\\s'+n+'\\s*=\\s*(?:"([^"]*)"|\'([^\']*)\')','i'));return m?dec(m[1]??m[2]):''}
function setAttr(tag,n,v){
  const re=new RegExp('(\\s'+n+'\\s*=\\s*)(?:"[^"]*"|\'[^\']*\')','i');
  if(re.test(tag))return tag.replace(re,(a,p)=>p+'"'+enc(v)+'"');
  return tag.replace(/\s*\/?>$/,m=>' '+n+'="'+enc(v)+'"'+m);
}
function scanLinks(html){
  const out=[],re=/<a\b[^>]*?\bdata-dl\b[^>]*>/gi;let m;
  while((m=re.exec(html))){
    const end=m.index+m[0].length,close=html.indexOf('</a>',end);
    out.push({tag:m[0],start:m.index,end,href:getAttr(m[0],'href'),q:getAttr(m[0],'data-q'),s:getAttr(m[0],'data-s'),txt:close>0?html.slice(end,close).replace(/<[^>]*>/g,'').trim():''});
  }
  return out;
}

async function vPages(){
  if(!bOn())return renderConn('পেজ ম্যানেজার',vPages);
  $('#main').innerHTML=`<h2 class="t">পেজ ম্যানেজার</h2><div class="panel" style="display:flex;gap:8px"><input id="np" placeholder="নতুন পেজের নাম"><button class="btn" id="npb">নতুন পেজ</button></div><div id="pgl"><div class="skl"></div></div>`;
  let items=[];
  const draw=()=>{$('#pgl').innerHTML=items.map(p=>`<div class="item" data-id="${esc(p.id)}"><div class="h"><div><b>${esc(p.title||'(নামহীন)')}</b> ${stPill(p.status)}<br><small>${esc((p.url||'').replace(/^https?:\/\/[^\/]+/,''))} • ${when(p.updated)}</small></div></div><div class="acts"><button class="btn gl sm" data-a="edit">এডিট</button>${p.url?`<a class="btn gl sm" href="${esc(p.url)}" target="_blank" rel="noopener">দেখুন</a>`:''}<button class="btn red sm" data-a="del">ডিলিট</button></div></div>`).join('')||'<p class="hint">কোনো পেজ নেই।</p>'};
  try{const j=await bapi(bb('pages'),{q:{fetchBodies:false,status:['live','draft'],view:'ADMIN'}});items=j.items||[];draw()}
  catch(e){if(e.need)return renderConn('পেজ ম্যানেজার',vPages);$('#pgl').innerHTML=errBox(e);return}
  $('#npb').onclick=async()=>{const t=$('#np').value.trim();if(!t)return;try{const r=await bapi(bb('pages'),{method:'POST',body:{kind:'blogger#page',title:t,content:''}});openEdit('page',r.id,'pages')}catch(e){toast('হয়নি: '+(e.message||e),1)}};
  $('#main').onclick=async e=>{
    const a=e.target.closest('[data-a]');if(!a)return;const id=a.closest('.item').dataset.id,p=items.find(x=>x.id===id);
    if(a.dataset.a==='edit')return openEdit('page',id,'pages');
    if(!confirm('"'+(p.title||'')+'" পেজ ডিলিট করবেন?'))return;
    try{await bapi(bb('pages/'+id),{method:'DELETE'});items=items.filter(x=>x.id!==id);draw();toast('ডিলিট হয়েছে')}catch(err){toast('হয়নি: '+(err.message||err),1)}
  };
}

/* ---------------- boot ---------------- */
onAuthStateChanged(auth,async u=>{
  if(!u)return showLogin();
  try{const s=await get(ref(db,'admins/'+u.uid));if(s.val()!==true)return showDenied(u)}catch{return showDenied(u)}
  showApp(u);
});
</script>
</body>
</html>
